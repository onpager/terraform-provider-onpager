name: Setup provider toolchain
description: Install the pinned development tools and restore project-local Go caches

inputs:
  terraform-version:
    description: Terraform CLI version
    required: false
    default: '1.17.1'

runs:
  using: composite
  steps:
    - name: Configure local caches
      shell: bash
      run: |
        echo "GOCACHE=$GITHUB_WORKSPACE/.harness/go-build" >> "$GITHUB_ENV"
        echo "GOMODCACHE=$GITHUB_WORKSPACE/.harness/go-mod" >> "$GITHUB_ENV"
        echo 'CHECKPOINT_DISABLE=1' >> "$GITHUB_ENV"
        echo 'TF_IN_AUTOMATION=1' >> "$GITHUB_ENV"

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache-dependency-path: |
          go.sum
          tools/go.sum

    - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      with:
        version: '3.53.1'

    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false

    - name: Check tools and download dependencies
      shell: bash
      run: task setup
